name: Prepare domain review

on:
  push:
    branches: [feat/domain-rentals-20260929]
    paths: [.github/workflows/apply-domain-review.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'jsk1004ha/RaibitServer' && github.ref == 'refs/heads/feat/domain-rentals-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and apply the exact reviewed patch
        run: |
          set -euo pipefail
          cat .github/domain-review.patch.1.b64 .github/domain-review.patch.2.b64 | base64 --decode | gzip --decompress > "$RUNNER_TEMP/domain-review.patch"
          echo "50f3bec6786df4da418c00c4184530f0d14656b063a2c96e9cf71725e3c8c62c  $RUNNER_TEMP/domain-review.patch" | sha256sum --check
          git apply --check --index "$RUNNER_TEMP/domain-review.patch"
          git apply --index "$RUNNER_TEMP/domain-review.patch"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the deterministic API contract and remove staging helpers
        run: |
          node scripts/generate-openapi.mjs
          node scripts/generate-openapi.mjs --check
          git add openapi/raibitserver.yaml
          git rm .github/domain-review.patch.1.b64 .github/domain-review.patch.2.b64 .github/workflows/apply-domain-review.yml
          git diff --cached --check
      - name: Export local Git manifest for explicit connector publication
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const changes = git('diff', '--cached', '--name-status', '--no-renames').split('\n');
          const tree = changes.map((change) => {
            const [status, path] = change.split('\t');
            if (!/^[AMD]$/.test(status) || !path || path.startsWith('/') || path.includes('..')) throw new Error('unexpected patch path');
            return { path, mode: '100644', type: 'blob', sha: status === 'D' ? null : git('hash-object', path) };
          });
          const candidate = { parent: git('rev-parse', 'HEAD'), base_tree: git('rev-parse', 'HEAD^{tree}'), tree };
          const output = `${process.env.RUNNER_TEMP}/domain-review-candidate`;
          fs.mkdirSync(output, { recursive: true });
          fs.writeFileSync(`${output}/candidate.json`, JSON.stringify(candidate, null, 2));
          fs.writeFileSync(`${output}/review.patch`, execFileSync('git', ['diff', '--cached', '--binary']));
          console.log(JSON.stringify(candidate, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: domain-review-candidate
          path: ${{ runner.temp }}/domain-review-candidate
          retention-days: 2
