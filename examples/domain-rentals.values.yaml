# Overlay onto your EXISTING production values; do not replace those values.
# DNS *.raibit.kr must reach the same Traefik gateway with Host preserved.
domainRentals:
  enabled: true
  baseDomain: raibit.kr
  # Empty reuses ingress.tls.existingSecret; it must cover *.raibit.kr.
  # When Cloudflare terminates HTTPS, configure its wildcard public hostname too.
  tlsSecret: ""
  # Comma-separated additional names already used outside this Helm release.
  # Core reserves api/app/admin/console/resources and apps--/preview--/... itself.
  reservedNames: ""
