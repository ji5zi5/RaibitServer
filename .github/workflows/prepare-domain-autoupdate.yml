name: Prepare domain auto-update

on:
  push:
    branches: [feat/domain-rentals-20260929]
    paths: [.github/workflows/prepare-domain-autoupdate.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'jsk1004ha/RaibitServer' && github.ref == 'refs/heads/feat/domain-rentals-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and apply the exact reviewed patch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/domain-autoupdate-candidate"
          cp .github/domain-autoupdate.patch.gz.b64 "$RUNNER_TEMP/domain-autoupdate-candidate/transport.b64"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('.github/domain-autoupdate.patch.gz.b64')
          s = p.read_text().strip()
          assert hashlib.sha256(s.encode()).hexdigest() == 'f9adf7059d34beb300f4c7d3696766f4c3266ba99a4f4e755a5fc16774f9022f'
          for a, b, before, after in [(3577,3578,'W',''),(296,298,'fC','V')]:
              assert s[a:b] == before
              s = s[:a] + after + s[b:]
          p.write_text(s + '\n')
          PY
          base64 --decode .github/domain-autoupdate.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/review.patch"
          echo "e669e130703f4964d56642e7e3959d2d6e278339c3201d79232b73f0f83a0843  $RUNNER_TEMP/review.patch" | sha256sum --check
          git apply --check --index "$RUNNER_TEMP/review.patch"
          git apply --index "$RUNNER_TEMP/review.patch"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-domain-rentals-helm.mjs')
          s = p.read_text()
          before = "const named = (docs, name) => docs.find((doc) => doc.metadata?.name === name);"
          after = "const named = (docs, name) => docs.find((doc) => doc.metadata?.name === name && doc.kind === 'Deployment') ?? docs.find((doc) => doc.metadata?.name === name);"
          assert s.count(before) == 1
          p.write_text(s.replace(before, after))
          PY
          cat > tests/domain-rentals-upgrade-api.test.js <<'JS'
          import test from 'node:test';
          import { createRequire } from 'node:module';
          // Register the existing Nest TypeScript loader, not its unprefixed
          // parity server. This test reproduces main.ts's production routing.
          import './fixtures/api-parity-runtime.mjs';
          const require = createRequire(new URL('../apps/api/package.json', import.meta.url));
          const { NestFactory } = require('@nestjs/core');
          const { AppModule } = require('./src/app.module.ts');
          const { DomainRentalsService } = require('./src/modules/domain-rentals/domain-rentals.module.ts');
          const { verifyApi } = createRequire(import.meta.url)('../infra/helm/raibitserver/files/domain-rentals-upgrade-check.cjs');
          test('post-upgrade probe validates real Nest with production prefix and Host middleware', async (t) => {
            process.env.NODE_ENV = 'test';
            process.env.RAIBITSERVER_AUTH_MODE = 'jwt';
            process.env.RAIBITSERVER_AUTH_JWT_SECRET = 'local-upgrade-probe-test-secret-only';
            process.env.RAIBITSERVER_ALLOW_MEMORY_PERSISTENCE = '1';
            process.env.RAIBITSERVER_DOMAIN_RENTAL_BASE_DOMAIN = 'raibit.kr';
            delete process.env.DATABASE_URL;
            const app = await NestFactory.create(AppModule, { logger: false, rawBody: true, abortOnError: false });
            t.after(() => app.close());
            const rentals = app.get(DomainRentalsService);
            app.use((req, res, next) => {
              void rentals.redirect(req, res).then((handled) => { if (!handled) next(); }).catch(next);
            });
            app.setGlobalPrefix('api');
            await app.listen(0, '127.0.0.1');
            await verifyApi({ apiUrl: await app.getUrl(), apiHost: 'api.raibit.kr', baseDomain: 'raibit.kr' });
          });
          JS
          git add scripts/check-domain-rentals-helm.mjs tests/domain-rentals-upgrade-api.test.js
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - run: pnpm install --frozen-lockfile
      - name: Check first-update guards and actual Helm output
        run: |
          set -o pipefail
          node --import ./tests/fixtures/resource-runtime.mjs --test tests/domain-rentals-auto-update.test.js tests/domain-rentals-upgrade-api.test.js 2>&1 | tee "$RUNNER_TEMP/domain-autoupdate-candidate/test.log"
          node scripts/check-domain-rentals-helm.mjs 2>&1 | tee "$RUNNER_TEMP/domain-autoupdate-candidate/helm.log"
          git diff --cached --check
      - name: Publish blobs, not commits or references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm -f .github/domain-autoupdate.patch.gz.b64 .github/workflows/prepare-domain-autoupdate.yml
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const repo = 'jsk1004ha/RaibitServer';
          if (process.env.GITHUB_REPOSITORY !== repo || process.env.GITHUB_REF !== 'refs/heads/feat/domain-rentals-20260929') throw new Error('scope mismatch');
          const tree = [];
          for (const change of git('diff', '--cached', '--name-status', '--no-renames').split('\n')) {
            const [status, path] = change.split('\t');
            if (!/^[AMD]$/.test(status) || !path || path.startsWith('/') || path.includes('..')) throw new Error('unexpected path');
            if (status === 'D') { tree.push({ path, mode: '100644', type: 'blob', sha: null }); continue; }
            const result = await fetch(`https://api.github.com/repos/${repo}/git/blobs`, {
              method: 'POST', headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json', 'x-github-api-version': '2022-11-28' },
              body: JSON.stringify({ content: fs.readFileSync(path).toString('base64'), encoding: 'base64' }),
            });
            const blob = await result.json();
            if (!result.ok) throw new Error(`blob upload ${result.status}`);
            const mode = git('ls-files', '--stage', path).split(' ')[0];
            tree.push({ path, mode, type: 'blob', sha: blob.sha });
          }
          const candidate = { parent: git('rev-parse', 'HEAD'), base_tree: git('rev-parse', 'HEAD^{tree}'), tree };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/domain-autoupdate-candidate/candidate.json`, JSON.stringify(candidate, null, 2));
          console.log(JSON.stringify(candidate, null, 2));
          // Only the authorized connector will publish the reviewed tree/commit.
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-autoupdate-candidate
          path: ${{ runner.temp }}/domain-autoupdate-candidate
          retention-days: 2
